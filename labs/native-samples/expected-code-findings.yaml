# Ground truth for the binary rules over the native samples (veritas.charter.yaml). Every candidate must be listed
# under `expected`, every listed item must be found, and nothing may be reported for a hardened twin. Header and
# import findings concern the whole file, so they have no function.
version: 1
expected:
