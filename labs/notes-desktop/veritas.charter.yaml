# Analysis charter for the notes-desktop lab: read the packed Electron app for security weaknesses.
# Relative paths resolve against this file's directory.
apiVersion: veritas/v1alpha1
kind: AnalysisCharter
metadata:
  name: notes-desktop-code
basis: owned
reference: { file: README.md }   # contents are hashed into the charter digest
purpose: >
  Read the lab's packed Electron app for security weaknesses in its own code, pages, and
  window settings, and inventory the dependencies it bundles.
subjects:
  - { path: dist/app.asar, sha256: 38bad77c53c01075bae1a9515018c7359d0646a5824ba404fdc116415d301e32 }
deliverables: [behavior-spec]
constraints:
  execute_subject: false
  network: none
  models: on
