apiVersion: veritas/plugin/v1alpha1
id: veritas.selftest
version: 0.0.1
kind: check
runtime:
  image: veritas/selftest:0.0.1   # built locally; digest recorded in veritas.lock
  command: []
protocol: vpp/1
operations:
  - name: attempt
    impact: probe
    output: [selftest-result]
capabilities:
  network: target-scope
  identities: none
  filesystem: { work: tmpfs, inputs: none }
resources: { cpu: "0.5", memory: 128Mi, pids: 32, timeout: 120s, output_max: 1Mi }
determinism: deterministic
