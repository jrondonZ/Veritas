# Analysis charter for the native-samples lab: read six small ELF, PE, and Mach-O files for their hardening,
# imports, and strings. Relative paths resolve against this file's directory.
apiVersion: veritas/v1alpha1
kind: AnalysisCharter
metadata:
  name: native-samples
basis: owned
reference: { file: README.md }   # contents are hashed into the charter digest
purpose: >
  Read the lab's native sample binaries for missing exploit mitigations, dangerous imports,
  and embedded secrets, and describe their formats and the platform functions they use.
subjects:
  - { path: dist/weak-elf, sha256: 5ea7aa9edddae4e6a779cc85b9352d74b9026cbb6c853fc32e3a7e7759aeae46 }
  - { path: dist/hardened-elf, sha256: f48612045f4dd32159aaa5f64e60d1a90e928db4f3a62311de9b959594c9559d }
  - { path: dist/weak.exe, sha256: 597f1e4da650e79bf70a93e4e6313f310f5b94acd08c46fad42491b0604c063b }
  - { path: dist/hardened.exe, sha256: 08ac28de974a1a674dd75a35b6e19fe96e1038f2dbb17eb0ff955fe9e8d31a4c }
  - { path: dist/weak-macho, sha256: 937135a4cb76077adb92067fdd545dcaae10083972169e40f90870c69579c91e }
  - { path: dist/hardened-macho, sha256: 121b87118219f8b4b9e68a5eb8ed9c2cd33ca36d952aa53da078d37c94b2f151 }
deliverables: [behavior-spec]
constraints:
  execute_subject: false
  network: none
  models: on
