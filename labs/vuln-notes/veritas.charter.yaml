# Analysis charter for the vuln-notes lab's own source and a recorded browsing session: read both for security
# weaknesses, then confirm each candidate live with veritas.scope.yaml. Relative paths resolve against this file's
# directory.
apiVersion: veritas/v1alpha1
kind: AnalysisCharter
metadata:
  name: vuln-notes-code
basis: owned
reference: { file: README.md }   # contents are hashed into the charter digest
purpose: >
  Read the lab app's own source and a recorded browsing session for security weaknesses, so
  each candidate can be confirmed live against the running lab with the Assess scope in the
  same directory.
subjects:
  - { path: app/server.mjs, sha256: e36fc184b55c27366d96f3dbe30368d62fb86bcf90de5bba58455886f176807e }
  - { path: app/db.mjs, sha256: 62524c3a87b6e9f3c4790035f9886b6671223008787be94ea78b7a0f5e34f3d4 }
  - { path: app/openapi.mjs, sha256: 9a50c789dde4ebe9c559196a121760e1a4bd164e38dcb7ce7e6e827c6dc00006 }
  - { path: app/start.mjs, sha256: 8015a655f8df05cc07a583f03a833f8e1f8da1e971051e066b221e44b1aa19b1 }
  - { path: app/reset.mjs, sha256: 7ccda92420cbd2c0f9775332beaf3beac0f3357d3db1081fb4a7dd3160f5f8b5 }
  - { path: recordings/browse.har, sha256: e2fb8b68d77d06a8e57e261a107bbe8d7d4339864d808efb74d0826c524bdd56 }
deliverables: [behavior-spec]
constraints:
  execute_subject: false
  network: none
  models: on
