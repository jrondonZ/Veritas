# Keeps the pinned workflow actions and the Python dependencies current. Updates arrive as pull requests for review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/plugins/*", "/docker/*", "/labs/vuln-notes/app"]
    schedule:
      interval: weekly
