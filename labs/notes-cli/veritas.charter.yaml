# Analysis charter for the notes-cli lab: read the compiled .NET tool's metadata and IL for security weaknesses.
# Relative paths resolve against this file's directory.
apiVersion: veritas/v1alpha1
kind: AnalysisCharter
metadata:
  name: notes-cli-assembly
basis: owned
reference: { file: README.md }   # contents are hashed into the charter digest
purpose: >
  Read the lab's compiled .NET tool for security weaknesses in its methods, and describe the
  assembly, what it references, and its public interface.
subjects:
  - { path: dist/NotesCli.exe, sha256: b09427424aa814ba0015baf90694ae3f85fcbfb595577d00efb54f4aa823017a }
deliverables: [behavior-spec]
constraints:
  execute_subject: false
  network: none
  models: on
