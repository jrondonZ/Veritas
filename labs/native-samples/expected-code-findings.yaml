  - { id: E2, rule: binary-no-dep, file: dist/weak-elf, function: null }
  - { id: E3, rule: binary-wx-memory, file: dist/weak-elf, function: null }
  - { id: E4, rule: insecure-rpath, file: dist/weak-elf, function: null }
  - { id: E5, rule: dangerous-function, file: dist/weak-elf, function: null }
  - { id: E6, rule: banned-api, file: dist/weak-elf, function: null }
  - { id: E7, rule: hardcoded-secret, file: dist/weak-elf, function: null }
  - { id: W1, rule: binary-no-aslr, file: dist/weak.exe, function: null }
  - { id: W2, rule: binary-no-dep, file: dist/weak.exe, function: null }
  - { id: W3, rule: binary-wx-memory, file: dist/weak.exe, function: null }
  - { id: W4, rule: dangerous-function, file: dist/weak.exe, function: null }
  - { id: W5, rule: banned-api, file: dist/weak.exe, function: null }
  - { id: M1, rule: binary-no-aslr, file: dist/weak-macho, function: null }
  - { id: M2, rule: binary-no-dep, file: dist/weak-macho, function: null }
  - { id: M3, rule: dangerous-function, file: dist/weak-macho, function: null }
