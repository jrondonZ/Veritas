# Scope for the bundled vuln-notes lab. Relative paths resolve against this file's directory.
apiVersion: veritas/v1alpha1
kind: AssessmentScope
metadata:
  name: vuln-notes-lab
authorization:
  basis: owned
  reference: { file: README.md }   # contents are hashed into the scope digest
  window: { start: 2026-11-18T00:00:00Z, end: 2027-06-30T23:59:59Z }
environment:
  kind: disposable
  provider: compose
  compose_file: compose.yaml
  reset: snapshot
targets:
  - id: web
    base_url: http://vuln-notes:8080
    addresses: [172.30.0.4]        # must match compose.yaml
    source: app
    openapi: /openapi.json
    allow:
      paths: ["/", "/health", "/openapi.json", "/logout", "/search", "/search2", "/go", "/go2", "/api/**", "/static/**"]
      methods: [GET, HEAD, POST, PUT]
    deny:
      paths: ["/api/admin/**"]
    unsafe_get: ["/logout"]
    limits: { rps: 10, concurrency: 4, max_requests: 5000 }
identities:
  - id: alice
    kind: synthetic
    target: web
    login: { type: form, path: /api/login, username: alice@lab.test, username_field: email, password_field: password }
    secret: env:VRT_ALICE
    canary: vrt-seed-alice
  - id: bob
    kind: synthetic
    target: web
    login: { type: form, path: /api/login, username: bob@lab.test, username_field: email, password_field: password }
    secret: env:VRT_BOB
    canary: vrt-seed-bob
sensors:
  - id: queries
    kind: query-log
    target: web
    volume: query-log              # declared in compose.yaml; the sensor mounts it read-only
  - id: activity
    kind: activity-log             # the files the app opens, the commands it runs, and the requests it makes
    target: web
    volume: query-log              # the same volume holds both logs
policy:
  auto_approve: [observe, probe, mutate]
  models: on
  prompt_redaction: on
budgets: { wall_clock: 20m, model_tokens: 2000000 }
